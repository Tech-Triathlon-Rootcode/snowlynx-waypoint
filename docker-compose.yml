services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: waypoint
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
    ports:
      - "5432:5432"
    volumes:
      - waypoint_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 3s
      timeout: 3s
      retries: 20

  setup:
    build:
      context: .
      target: tooling
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@postgres:5432/waypoint
      DEMO_PASSWORD: SnowlynX2026!
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@postgres:5432/waypoint
      SESSION_SECRET: local-demo-session-secret-change-in-production-2026
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  waypoint_postgres:
